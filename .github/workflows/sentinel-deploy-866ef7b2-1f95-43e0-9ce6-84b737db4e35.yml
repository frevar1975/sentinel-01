name: Deploy Content to law-sc200-lab [866ef7b2-1f95-43e0-9ce6-84b737db4e35]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-866ef7b2-1f95-43e0-9ce6-84b737db4e35.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-866ef7b2-1f95-43e0-9ce6-84b737db4e35.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'rg-sc200-lab'
      workspaceName: 'law-sc200-lab'
      workspaceId: '56519462-06d9-4add-ad0f-3c6dae6420ba'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'Playbook,Workbook,Watchlist,Parser,HuntingQuery,AutomationRule,AnalyticsRule'
      branch: 'main'
      sourceControlId: '866ef7b2-1f95-43e0-9ce6-84b737db4e35'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_866ef7b21f9543e09ce684b737db4e35 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_866ef7b21f9543e09ce684b737db4e35 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_866ef7b21f9543e09ce684b737db4e35 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_866ef7b21f9543e09ce684b737db4e35 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_866ef7b21f9543e09ce684b737db4e35 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_866ef7b21f9543e09ce684b737db4e35 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_866ef7b21f9543e09ce684b737db4e35 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_866ef7b21f9543e09ce684b737db4e35 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_866ef7b21f9543e09ce684b737db4e35 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-866ef7b2-1f95-43e0-9ce6-84b737db4e35.ps1